<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedal Bakery</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f6;
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  #view { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #overlay {
    position: fixed; inset: 0; z-index: 10; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(246, 246, 248, 0.94); color: #2b2b30;
    user-select: none; -webkit-user-select: none;
  }
  #overlay .t1 { font-size: 44px; font-weight: 700; letter-spacing: 0.14em; }
  #overlay .t2 { font-size: 15px; letter-spacing: 0.55em; text-transform: uppercase; color: #6a6a72; }
  #overlay .t3 {
    margin-top: 26px; font-size: 14px; letter-spacing: 0.1em;
    border: 1px solid #c9c9d0; border-radius: 999px; padding: 10px 22px; background: #fff;
  }
  #bakery {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; flex-direction: column-reverse; align-items: center; gap: 10px;
    width: min(720px, 92vw);
  }
  #bakery-row { display: flex; gap: 8px; width: 100%; }
  #bake-input {
    flex: 1; font: inherit; font-size: 16px; color: #2b2b30;
    background: rgba(255, 255, 255, 0.94); border: 1px solid #d5d5dc; border-radius: 999px;
    padding: 14px 22px; outline: none;
    box-shadow: 0 6px 24px rgba(30, 30, 40, 0.10);
  }
  #bake-input:focus { border-color: #a9a9b4; }
  #bake-button {
    font: inherit; font-size: 15px; letter-spacing: 0.12em; cursor: pointer; color: #fff;
    background: #2b2b30; border: none; border-radius: 999px; padding: 14px 28px;
    box-shadow: 0 6px 24px rgba(30, 30, 40, 0.14);
  }
  #bake-button:disabled { background: #a9a9b4; cursor: wait; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
    border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bake-status.pulse { animation: pulse 1.3s ease-in-out infinite; color: #2b2b30; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  #bake-status { font-size: 14px; letter-spacing: 0.06em; color: #6a6a72; min-height: 18px; }
  #shelf {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 6; width: 264px;
    background: rgba(255, 255, 255, 0.42);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border-right: 1px solid rgba(220, 220, 226, 0.6);
    display: flex; flex-direction: column;
  }
  #shelf-title {
    padding: 22px 18px 14px; font-size: 15px; font-weight: 700;
    letter-spacing: 0.22em; color: #2b2b30;
  }
  #shelf-tools { display: flex; gap: 6px; padding: 0 12px 10px; }
  #shelf-tools .chip {
    font: inherit; font-size: 13px; letter-spacing: 0.08em; cursor: pointer; color: #2b2b30;
    background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(200, 200, 208, 0.8);
    border-radius: 999px; padding: 8px 16px;
  }
  #shelf-tools .chip:hover { background: #fff; }
  #shelf-search {
    font: inherit; font-size: 13px; color: #2b2b30; margin: 0 12px 8px;
    background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(200, 200, 208, 0.8);
    border-radius: 9px; padding: 8px 12px; outline: none;
  }
  #shelf-search:focus { border-color: #a9a9b4; background: #fff; }
  #shelf-sort { display: flex; gap: 4px; padding: 0 12px 10px; }
  #shelf-sort button {
    font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em;
    cursor: pointer; color: #6a6a72; background: none;
    border: none; border-radius: 7px; padding: 4px 9px;
  }
  #shelf-sort button.active { background: rgba(58, 123, 213, 0.14); color: #3a7bd5; }
  #shelf-list { overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .shelf-item.drop-above { box-shadow: 0 -3px 0 #3a7bd5; }
  .shelf-item {
    font: inherit; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(227, 227, 232, 0.7);
    border-radius: 10px; padding: 6px 10px 6px 6px;
  }
  .shelf-item:hover { background: rgba(255, 255, 255, 0.85); border-color: #a9a9b4; }
  .si-icon {
    width: 78px; height: 54px; object-fit: cover; border-radius: 8px;
    background: #ececf0; flex: none;
  }
  .si-name { font-size: 14px; font-weight: 600; color: #2b2b30; }
  .si-badge {
    margin-left: 6px; font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    color: #fff; background: #b04a3a; border-radius: 5px; padding: 2px 5px;
    vertical-align: 2px;
  }
  .shelf-error { font-size: 11px; color: #a05252; padding: 8px 6px; }
  #source-menu {
    position: fixed; z-index: 9; display: none; flex-direction: column; gap: 2px;
    background: rgba(255, 255, 255, 0.97); border: 1px solid #dcdce2; border-radius: 12px;
    padding: 6px; box-shadow: 0 8px 28px rgba(30, 30, 40, 0.14);
  }
  #source-menu {
    width: 340px; padding: 8px; border-radius: 16px;
    max-height: calc(100vh - 24px); overflow-y: auto;
  }
  #menu-handle {
    text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: 0.3em;
    color: #b8b9c2; padding: 4px 0 2px; cursor: grab; user-select: none;
    -webkit-user-select: none; touch-action: none;
  }
  #menu-handle:active { cursor: grabbing; }
  .menu-section {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; color: #9a9aa4;
    padding: 8px 10px 4px;
  }
  .menu-row {
    font: inherit; font-size: 14px; text-align: left; display: flex; gap: 6px;
    align-items: center; color: #2b2b30; background: none; border: none;
    border-radius: 9px; padding: 7px 10px; cursor: pointer; white-space: nowrap;
  }
  .menu-row:hover { background: #ececf2; }
  .menu-row.active { font-weight: 600; }
  .menu-row .check { width: 20px; color: #3a7bd5; font-weight: 700; flex: none; }
  .chord-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 2px 8px 6px; }
  .chip-sm {
    font: inherit; font-size: 12px; letter-spacing: 0.03em; cursor: pointer;
    color: #2b2b30; background: #f1f1f5; border: 1px solid transparent;
    border-radius: 8px; padding: 6px 2px; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip-sm:hover { background: #e6e6ec; }
  .chip-sm.active { background: #3a7bd5; color: #fff; font-weight: 600; }
  #hud {
    display: none;
    position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%); z-index: 5;
    font-size: 15px; letter-spacing: 0.12em; color: #55555c;
    background: rgba(255, 255, 255, 0.85); border: 1px solid #dcdce2; border-radius: 999px;
    padding: 8px 18px; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="shelf">
  <div id="shelf-title">PEDAL SHELF</div>
  <div id="shelf-tools"></div>
  <input id="shelf-search" type="text" placeholder="Search" spellcheck="false">
  <div id="shelf-sort"></div>
  <div id="shelf-list"></div>
</div>
<div id="bakery">
  <div id="bakery-row">
    <input id="bake-input" type="text" spellcheck="false"
      placeholder="describe a sound… e.g. a broken church organ underwater">
    <button id="bake-button">BAKE</button>
  </div>
  <div id="bake-status"></div>
</div>
<div id="overlay">
  <div class="t1">PEDAL BAKERY</div>
  <div class="t2">limitless guitar effects</div>
  <div class="t3">click to plug in</div>
</div>
<div id="source-menu"></div>
<div id="hud"></div>
<script>
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(`${e.message} @ ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + e.reason));
</script>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>

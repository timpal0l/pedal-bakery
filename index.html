<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedal Bakery</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #212227;
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  #view { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  /* dark scrollbars everywhere the UI scrolls */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16); border-radius: 999px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); background-clip: padding-box; }
  #shelf-list, #source-menu, #lobby-sessions {
    scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
  }
  /* the whole 2D UI runs at 120% — it reads better at GarageBand scale */
  #shelf, #bakery, #hud, #source-menu, #riff-shelf, #master-bar { zoom: 1.2; }
  #master-bar {
    position: fixed; top: 14px; left: 288px; z-index: 8;
    display: flex; align-items: center; gap: 10px;
    background: rgba(32, 33, 39, 0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 7px 14px 7px 8px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #panic {
    font: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    cursor: pointer; color: #fff; background: #a33b3b; border: none;
    border-radius: 999px; padding: 6px 12px;
  }
  #panic:hover { background: #c04747; }
  #master-vol { width: 120px; accent-color: #3a7bd5; }
  #master-vol-txt { font-size: 12px; color: #9a9ba5; width: 24px; text-align: right; }
  #overlay {
    position: fixed; inset: 0; z-index: 10; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(28, 29, 34, 0.95); color: #e8e8ec;
    user-select: none; -webkit-user-select: none;
  }
  #overlay .t1 { font-size: 44px; font-weight: 700; letter-spacing: 0.14em; }
  #overlay .t2 { font-size: 15px; letter-spacing: 0.55em; text-transform: uppercase; color: #8a8b95; }
  #lobby {
    margin-top: 30px; display: flex; flex-direction: column; gap: 11px;
    width: min(360px, 86vw); align-items: stretch;
  }
  #player-name {
    font: inherit; font-size: 15px; text-align: center; color: #e8e8ec;
    padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
    outline: none; background: rgba(255,255,255,0.07); letter-spacing: 0.06em;
  }
  #bakery-name {
    font: inherit; font-size: 15px; text-align: center; color: #e8e8ec;
    padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
    outline: none; background: rgba(255,255,255,0.07); letter-spacing: 0.04em;
  }
  #bakery-name::placeholder, #player-name::placeholder { color: #7c7d87; }
  #bakery-name:focus { border-color: rgba(255,255,255,0.3); }
  #player-name:focus { border-color: rgba(255,255,255,0.3); }
  .lobby-btn {
    font: inherit; font-size: 15px; letter-spacing: 0.14em; cursor: pointer;
    border: none; border-radius: 999px; padding: 14px 22px;
  }
  .lobby-btn:disabled { opacity: 0.5; cursor: wait; }
  #create-bakery { background: #3a7bd5; color: #fff; }
  #join-bakery { background: rgba(255,255,255,0.08); color: #e8e8ec; border: 1px solid rgba(255,255,255,0.14); }
  #join-row { display: flex; gap: 8px; }
  #join-row[hidden] { display: none; } /* display:flex would defeat [hidden] */
  #join-code {
    flex: 1; min-width: 0; font: inherit; font-size: 18px; font-weight: 700;
    letter-spacing: 0.5em; text-transform: uppercase; text-align: center;
    color: #e8e8ec; padding: 12px 0 12px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.14); outline: none; background: rgba(255,255,255,0.07);
  }
  #join-code::placeholder { color: #7c7d87; }
  #join-go { background: #3a7bd5; color: #fff; flex: none; }
  #lobby-error { min-height: 18px; font-size: 13px; color: #ff8a7e; text-align: center; }
  #lobby-title-sm {
    font-size: 11px; font-weight: 700; letter-spacing: 0.3em; color: #7c7d87;
    margin-top: 8px; text-align: center;
  }
  #lobby-sessions {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 190px; overflow-y: auto;
  }
  .session-row {
    display: flex; align-items: center; gap: 10px; text-align: left;
    font: inherit; font-size: 14px; color: #e8e8ec; cursor: pointer;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 10px 12px 10px 16px;
  }
  .session-row:hover { border-color: rgba(255,255,255,0.28); }
  .session-name { font-weight: 600; }
  .session-code { font-weight: 700; letter-spacing: 0.2em; opacity: 0.55; font-size: 12px; }
  .session-meta { color: #8a8b95; font-size: 12px; flex: 1; text-align: right; }
  .session-x {
    border: none; background: none; color: #7c7d87; cursor: pointer;
    font: inherit; font-size: 14px; padding: 2px 4px;
  }
  .session-x:hover { color: #ff8a7e; }
  #room-badge {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 7;
    display: flex; align-items: center; gap: 12px;
    background: rgba(32, 33, 39, 0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 8px 10px 8px 18px;
    font-size: 13px; letter-spacing: 0.08em; color: #e8e8ec;
    box-shadow: 0 6px 24px rgba(30, 30, 40, 0.10);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #room-badge[hidden] { display: none; }
  #room-name-txt { font-weight: 600; cursor: text; max-width: 200px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #room-name-txt:hover { text-decoration: underline dotted rgba(255,255,255,0.4); }
  #room-name-txt:empty::before { content: 'name this bakery'; opacity: 0.45; }
  #room-name-edit {
    font: inherit; font-size: 13px; color: #e8e8ec; width: 180px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px; padding: 3px 10px; outline: none;
  }
  #room-code-txt { font-weight: 700; letter-spacing: 0.24em; opacity: 0.6; font-size: 12px; }
  #room-players { color: #8a8b95; white-space: nowrap; }
  #room-copy {
    font: inherit; font-size: 11px; letter-spacing: 0.1em; cursor: pointer;
    background: rgba(255, 255, 255, 0.12); color: #e8e8ec; border: none; border-radius: 999px;
    padding: 6px 13px;
  }
  #bakery {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; flex-direction: column-reverse; align-items: center; gap: 10px;
    width: min(720px, 92vw);
  }
  #bakery-row { display: flex; gap: 8px; width: 100%; }
  #bake-input {
    flex: 1; font: inherit; font-size: 16px; color: #e8e8ec;
    background: rgba(36, 37, 43, 0.92); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
    padding: 14px 22px; outline: none;
    box-shadow: 0 6px 24px rgba(30, 30, 40, 0.10);
  }
  #bake-input::placeholder { color: #7c7d87; }
  #bake-input:focus { border-color: rgba(255,255,255,0.3); }
  #bake-button {
    font: inherit; font-size: 15px; letter-spacing: 0.12em; cursor: pointer; color: #fff;
    background: #3a7bd5; border: none; border-radius: 999px; padding: 14px 28px;
    box-shadow: 0 6px 24px rgba(30, 30, 40, 0.14);
  }
  #bake-button:hover { background: #4a89e0; }
  #bake-button:disabled { background: #33415c; color: #9db4d8; cursor: wait; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
    border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bake-status.pulse { animation: pulse 1.3s ease-in-out infinite; color: #e8e8ec; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  #bake-status { font-size: 14px; letter-spacing: 0.06em; color: #9a9ba5; min-height: 18px; }
  #shelf {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 6; width: 264px;
    background: rgba(26, 27, 32, 0.6);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; flex-direction: column;
  }
  #shelf-title {
    padding: 22px 18px 14px; font-size: 15px; font-weight: 700;
    letter-spacing: 0.22em; color: #e8e8ec;
  }
  #shelf-tools { display: flex; gap: 6px; padding: 0 12px 10px; }
  #shelf-tools .chip {
    font: inherit; font-size: 13px; letter-spacing: 0.08em; cursor: pointer; color: #e8e8ec;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px; padding: 8px 16px;
  }
  #shelf-tools .chip:hover { background: rgba(255, 255, 255, 0.16); }
  #shelf-search {
    font: inherit; font-size: 13px; color: #e8e8ec; margin: 0 12px 8px;
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 9px; padding: 8px 12px; outline: none;
  }
  #shelf-search::placeholder { color: #7c7d87; }
  #shelf-search:focus { border-color: rgba(255, 255, 255, 0.28); background: rgba(255, 255, 255, 0.1); }
  #shelf-sort { display: flex; gap: 4px; padding: 0 12px 10px; }
  #shelf-sort button {
    font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em;
    cursor: pointer; color: #8a8b95; background: none;
    border: none; border-radius: 7px; padding: 4px 9px;
  }
  #shelf-sort button.active { background: rgba(90, 150, 240, 0.2); color: #7eb0ff; }
  #shelf-list { overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .shelf-item.drop-above { box-shadow: 0 -3px 0 #3a7bd5; }
  .shelf-item {
    font: inherit; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px; padding: 6px 10px 6px 6px;
  }
  .shelf-item:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); }
  .si-icon {
    width: 78px; height: 54px; object-fit: cover; border-radius: 8px;
    background: #26272c; flex: none;
  }
  .si-name { font-size: 14px; font-weight: 600; color: #e8e8ec; }
  .si-badge {
    margin-left: 6px; font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    color: #fff; background: #b04a3a; border-radius: 5px; padding: 2px 5px;
    vertical-align: 2px;
  }
  .shelf-error { font-size: 11px; color: #ff8a7e; padding: 8px 6px; }
  /* the riff shelf is a drawer, not furniture: it slides in when an input is
     on RIFF and gets out of the way for drums, bass, strum and the lobby */
  #riff-shelf {
    position: fixed; top: 0; bottom: 0; right: 0; z-index: 6; width: 272px;
    background: rgba(26, 27, 32, 0.6);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; flex-direction: column;
    transform: translateX(100%); visibility: hidden;
    transition: transform 0.18s ease, visibility 0.18s;
  }
  body.riffs-open #riff-shelf { transform: none; visibility: visible; }
  #riff-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 14px 14px 18px; font-size: 15px; font-weight: 700;
    letter-spacing: 0.22em; color: #e8e8ec;
  }
  #riff-search {
    font: inherit; font-size: 13px; color: #e8e8ec; margin: 0 12px 8px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; padding: 8px 12px; outline: none;
  }
  #riff-search::placeholder { color: #7c7d87; }
  #riff-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; display: flex;
    flex-direction: column; gap: 6px; }
  .riff-item {
    font: inherit; text-align: left; cursor: pointer; color: #e8e8ec;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 9px 12px;
  }
  .riff-item:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }
  .riff-item.active { background: rgba(58,123,213,0.28); border-color: #3a7bd5; }
  .ri-name { font-size: 13.5px; font-weight: 600; }
  .ri-meta { font-size: 10.5px; color: #8a8b95; margin-top: 2px; letter-spacing: 0.04em; }
  #riff-bake-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 4px;
    border-top: 1px solid rgba(255,255,255,0.08); }
  #riff-input {
    font: inherit; font-size: 12.5px; color: #e8e8ec;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; padding: 9px 12px; outline: none;
  }
  #riff-input::placeholder { color: #7c7d87; }
  #riff-button {
    font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    cursor: pointer; color: #fff; background: #3a7bd5; border: none;
    border-radius: 9px; padding: 9px 0;
  }
  #riff-button:disabled { background: #33415c; color: #9db4d8; cursor: wait; }
  #riff-status { font-size: 11px; color: #8a8b95; padding: 4px 14px 12px; min-height: 14px; }
  #source-menu {
    position: fixed; z-index: 9; display: none; flex-direction: column; gap: 2px;
    width: 300px; padding: 10px 12px; border-radius: 0;
    top: 0; right: 0; bottom: 0; left: auto;
    border-left: 1px solid rgba(255, 255, 255, 0.08); border-top: none;
    border-right: none; border-bottom: none;
    background: rgba(26, 27, 32, 0.65);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    overflow-y: auto; box-shadow: none;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 6px 10px;
  }
  .panel-title { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: #e8e8ec; }
  .panel-sub { font-size: 11px; color: #8a8b95; margin-top: 2px; }
  .panel-x {
    font: inherit; font-size: 14px; cursor: pointer; color: #c0c1c9;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px; width: 26px; height: 26px; line-height: 1;
  }
  .ctl-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; }
  .ctl-row label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: #b8b9c2; width: 64px; flex: none; overflow: hidden; text-overflow: ellipsis; }
  .ctl-row input[type=range] { flex: 1; accent-color: #3a7bd5; }
  .ctl-row .val { font-size: 11px; color: #8a8b95; width: 26px; text-align: right; }
  .panel-btn {
    font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    cursor: pointer; border-radius: 9px; padding: 8px 0; margin: 4px 8px;
    border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.08); color: #e8e8ec;
  }
  .panel-btn.danger { color: #ff8a7e; border-color: rgba(255, 138, 126, 0.35); }
  .menu-section {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; color: #7c7d87;
    padding: 8px 10px 4px;
  }
  .menu-row {
    font: inherit; font-size: 14px; text-align: left; display: flex; gap: 6px;
    align-items: center; color: #e8e8ec; background: none; border: none;
    border-radius: 9px; padding: 7px 10px; cursor: pointer; white-space: nowrap;
  }
  .menu-row:hover { background: rgba(255, 255, 255, 0.08); }
  .menu-row.active { font-weight: 600; }
  .menu-row .check { width: 20px; color: #7eb0ff; font-weight: 700; flex: none; }
  .chord-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 2px 8px 6px; }
  .chip-sm {
    font: inherit; font-size: 12px; letter-spacing: 0.03em; cursor: pointer;
    color: #e8e8ec; background: rgba(255, 255, 255, 0.08); border: 1px solid transparent;
    border-radius: 8px; padding: 6px 2px; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip-sm:hover { background: rgba(255, 255, 255, 0.15); }
  .chip-sm.active { background: #3a7bd5; color: #fff; font-weight: 600; }
  .chip-sm small { display: block; font-size: 9px; font-weight: 600; opacity: 0.6; }
  #hud {
    display: none;
    position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%); z-index: 5;
    font-size: 15px; letter-spacing: 0.12em; color: #d0d1d9;
    background: rgba(32, 33, 39, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 999px;
    padding: 8px 18px; pointer-events: none; white-space: nowrap;
  }
  /* the tape machine: record the room, then keep the take or bin it */
  /* anchored just right of the pedal shelf: the strip between the two
     shelves is the only free real estate, and the room badge owns its far
     end, so the tape grows rightward from here and never reaches it */
  /* stacked under the master bar rather than beside it — the two are one
     column of transport controls, and the room badge owns the top centre */
  #recorder {
    position: fixed; top: 72px; left: 346px; z-index: 7;
    display: flex; align-items: center; gap: 10px;
    background: rgba(32, 33, 39, 0.85); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px; padding: 7px 10px 7px 8px; color: #e8e8ec;
    font-size: 12px; letter-spacing: 0.1em;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #rec-toggle {
    font: inherit; font-size: 12px; letter-spacing: 0.14em; cursor: pointer; color: #e8e8ec;
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.1); border: none; border-radius: 999px; padding: 7px 15px;
  }
  #rec-toggle:hover { background: rgba(255, 255, 255, 0.18); }
  #rec-toggle .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #e0503c; display: inline-block;
  }
  #recorder.on #rec-toggle { background: #c0392b; color: #fff; }
  #recorder.on #rec-toggle .dot { background: #fff; animation: recblink 1.1s infinite; }
  @keyframes recblink { 50% { opacity: 0.15; } }
  #rec-time { font-variant-numeric: tabular-nums; opacity: 0.75; min-width: 40px; }
  #rec-take { display: flex; align-items: center; gap: 8px; }
  #rec-take audio { height: 30px; width: 190px; }
  #recorder button.rec-act {
    font: inherit; font-size: 11px; letter-spacing: 0.1em; cursor: pointer; color: #e8e8ec;
    background: rgba(255, 255, 255, 0.12); border: none; border-radius: 999px; padding: 6px 13px;
  }
  #recorder button.rec-act:hover { background: rgba(255, 255, 255, 0.2); }
  #recorder[hidden], #recorder [hidden] { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="shelf">
  <div id="shelf-title">PEDAL SHELF</div>
  <div id="shelf-tools"></div>
  <input id="shelf-search" type="text" placeholder="Search" spellcheck="false">
  <div id="shelf-sort"></div>
  <div id="shelf-list"></div>
</div>
<div id="bakery">
  <div id="bakery-row">
    <input id="bake-input" type="text" spellcheck="false"
      placeholder="describe a sound… e.g. a broken church organ underwater">
    <button id="bake-button">BAKE</button>
  </div>
  <div id="bake-status"></div>
</div>
<div id="overlay">
  <div class="t1">PEDAL BAKERY</div>
  <div class="t2">limitless guitar effects</div>
  <div id="lobby">
    <input id="player-name" type="text" maxlength="24" spellcheck="false"
      autocomplete="off" placeholder="your name">
    <input id="bakery-name" type="text" maxlength="40" spellcheck="false"
      autocomplete="off" placeholder="bakery name (optional)">
    <button id="create-bakery" class="lobby-btn">CREATE BAKERY</button>
    <button id="join-bakery" class="lobby-btn">JOIN BAKERY</button>
    <div id="join-row" hidden>
      <input id="join-code" type="text" maxlength="5" spellcheck="false"
        autocomplete="off" placeholder="CODE">
      <button id="join-go" class="lobby-btn">JOIN</button>
    </div>
    <div id="lobby-error"></div>
    <div id="lobby-title-sm" hidden>YOUR BAKERIES</div>
    <div id="lobby-sessions"></div>
  </div>
</div>
<div id="room-badge" hidden>
  <span id="room-name-txt" title="click to rename"></span>
  <input id="room-name-edit" type="text" maxlength="40" spellcheck="false" hidden>
  <span id="room-code-txt"></span>
  <span id="room-players"></span>
  <button id="room-copy">COPY</button>
</div>
<div id="riff-shelf">
  <div id="riff-title">RIFF SHELF</div>
  <input id="riff-search" type="text" placeholder="Search" spellcheck="false">
  <div id="riff-list"></div>
  <div id="riff-bake-row">
    <input id="riff-input" type="text" spellcheck="false"
      placeholder="describe a riff… e.g. saharan desert blues, quarter-tone bends">
    <button id="riff-button">BAKE RIFF</button>
  </div>
  <div id="riff-status"></div>
</div>
<div id="master-bar">
  <button id="panic" title="silence everything">MUTE</button>
  <input id="master-vol" type="range" min="0" max="100" value="50" title="master volume">
  <span id="master-vol-txt">50</span>
</div>
<div id="source-menu"></div>
<div id="recorder" hidden>
  <button id="rec-toggle"><span class="dot"></span><span id="rec-label">RECORD</span></button>
  <span id="rec-time" hidden>0:00</span>
  <span id="rec-take" hidden>
    <audio id="rec-audio" controls></audio>
    <button id="rec-save" class="rec-act">DOWNLOAD</button>
    <button id="rec-share" class="rec-act" hidden>SHARE</button>
    <button id="rec-bin" class="rec-act">BIN</button>
  </span>
</div>
<div id="hud"></div>
<script>
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(`${e.message} @ ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + e.reason));
</script>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
